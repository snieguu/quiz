<style>
:root{

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#142019; --paper:#1C2A22; --ink:#ECF2EE; --muted:#A9BDB0;
    --gable:#7CC59E; --gable-soft:#24402F; --blossom:#4A2A33; --blossom-ink:#F3B8C6;
    --wrong:#F08C98; --wrong-soft:#4A2329; --line:#30473A; --roof:#4F9C74; --wall:#DDE6E0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#142019; --paper:#1C2A22; --ink:#ECF2EE; --muted:#A9BDB0;
  --gable:#7CC59E; --gable-soft:#24402F; --blossom:#4A2A33; --blossom-ink:#F3B8C6;
  --wrong:#F08C98; --wrong-soft:#4A2329; --line:#30473A; --roof:#4F9C74; --wall:#DDE6E0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1.125rem; line-height:1.5;
}
main{max-width:640px;margin:0 auto;padding:1.25rem 1rem 3rem}
h1,h2,.q-text{font-family:"Alegreya",Georgia,"Times New Roman",serif}
h1{font-size:2.1rem;line-height:1.1;margin:.5rem 0 .25rem;font-weight:800}
h2{font-size:1.6rem;margin:0 0 .5rem}
p{margin:.4rem 0}
.lead{color:var(--muted);max-width:34em}
.house{display:block;width:100%;max-width:300px;height:auto;margin:0 auto .5rem}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:1.25rem}
.count-big{font-family:"Alegreya",Georgia,serif;font-size:3.4rem;font-weight:800;color:var(--gable);line-height:1;margin:.5rem 0 0}
input[type=range]{width:100%;accent-color:var(--gable);height:2rem;margin:.75rem 0}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.25rem 0 1rem}
.chip{font:inherit;font-size:1rem;padding:.4rem .9rem;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gable-soft);border-color:var(--gable)}
.btn{font:inherit;font-weight:700;font-size:1.15rem;width:100%;padding:.9rem 1rem;border-radius:14px;border:none;background:var(--gable);color:var(--paper);cursor:pointer}
.btn.secondary{background:transparent;color:var(--gable);border:2px solid var(--gable)}
button:focus-visible{outline:3px solid var(--blossom-ink);outline-offset:3px}
.topbar{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.4rem;color:var(--muted);font-size:1rem}
.track{height:10px;border-radius:999px;background:var(--gable-soft);overflow:hidden;margin-bottom:1.25rem}
.fill{height:100%;background:var(--gable);width:0;transition:width .3s}
.q-text{font-size:1.45rem;font-weight:700;line-height:1.3;margin:0 0 1rem}
.answers{display:grid;gap:.65rem}
.ans{
  font:inherit;text-align:left;display:flex;gap:.75rem;align-items:flex-start;
  padding:.8rem .9rem;border-radius:14px;border:2px solid var(--line);
  background:var(--paper);color:var(--ink);cursor:pointer;width:100%;
}
.ans:hover:not(:disabled){border-color:var(--gable)}
.letter{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--gable-soft);color:var(--gable)}
.ans.right{background:var(--gable-soft);border-color:var(--gable)}
.ans.right .letter{background:var(--gable);color:var(--paper)}
.ans.wrong{background:var(--wrong-soft);border-color:var(--wrong)}
.ans.wrong .letter{background:var(--wrong);color:var(--paper)}
.ans:disabled{cursor:default}
.feedback{min-height:1.6em;margin:1rem 0 .75rem;font-weight:700}
.feedback.ok{color:var(--gable)} .feedback.bad{color:var(--wrong)}
.score-row{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.result-num{font-family:"Alegreya",Georgia,serif;font-size:4rem;font-weight:800;color:var(--gable);line-height:1}
.review{list-style:none;padding:0;margin:1rem 0}
.review li{padding:.75rem 0;border-top:1px solid var(--line)}
.review .q{font-weight:700}
.review .yours{color:var(--wrong)} .review .good{color:var(--gable)}
.stack{display:grid;gap:.6rem;margin-top:1rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>

["Jaką nagrodę zdobyła Ania w Akademii Królowej?","Stypendium Avery’ego","Złoty medal","Puchar","Wycieczkę do Anglii"],
["Co zdobył Gilbert w Akademii Królowej?","Złoty medal","Stypendium Avery’ego","Nagrodę sportową","Nic nie zdobył"],
["Na co pozwalało Ani stypendium?","Na studia w college’u w Redmond","Na podróż do Europy","Na kupno farmy","Na wakacje nad morzem"],
["Co sprawiło, że Mateusz zmarł?","Serce nie wytrzymało wiadomości o upadku banku","Spadł z konia","Utonął w jeziorze","Zachorował na grypę"],
["Jak nazywał się bank, który upadł?","Bank Abbey","Bank Królewski","Bank Avonlea","Bank Kanady"],
["Co zaczęło dolegać Maryli pod koniec książki?","Słabł jej wzrok","Straciła słuch","Złamała nogę","Zapomniała mówić"],
["Co Maryla chciała zrobić z Zielonym Wzgórzem po śmierci Mateusza?","Sprzedać je","Oddać kościołowi","Zburzyć","Przerobić na szkołę"],
["Dlaczego Ania zrezygnowała z wyjazdu na studia?","Chciała zostać z Marylą","Nie zdała egzaminów","Gilbert ją o to poprosił","Bała się dużego miasta"],
["Co zrobił Gilbert, żeby pomóc Ani?","Oddał jej posadę nauczyciela w Avonlea","Kupił Zielone Wzgórze","Pożyczył jej pieniądze","Zawiózł Marylę do lekarza"],
["Gdzie Gilbert miał uczyć zamiast w Avonlea?","W White Sands","W Charlottetown","W Carmody","W Toronto"],
["Kim był dla Maryli ojciec Gilberta, gdy była młoda?","Jej dawną sympatią","Jej bratem","Jej lekarzem","Jej nauczycielem"],
["Jak kończy się relacja Ani i Gilberta w tej książce?","Zostają przyjaciółmi","Nadal się kłócą","Biorą ślub","Przestają się znać"],
["Ile lat ma Ania pod koniec książki?","Około 16","11","25","40"],
["W którym roku po raz pierwszy wydano książkę?","1908","1858","1958","1998"]
];

const $ = id => document.getElementById(id);
const L = ["A","B","C","D"];
let deck=[], i=0, score=0, misses=[], n=20;

function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function show(id){["start","quiz","end"].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0);}

function setN(v){
  n=Math.max(10,Math.min(Q.length,+v));
  $("count").value=n; $("countOut").textContent=n;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(+c.dataset.n===n)));
}
$("count").max=Q.length;
$("count").addEventListener("input",e=>setN(e.target.value));
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>setN(c.dataset.n)));

function start(){
  deck=shuffle(Q).slice(0,n).map(q=>({q:q[0],good:q[1],opts:shuffle(q.slice(1))}));
  i=0;score=0;misses=[];
  show("quiz");render();
}
function render(){
  const cur=deck[i];
  $("pos").textContent=`Pytanie ${i+1} z ${deck.length}`;
  $("pts").textContent=`Punkty: ${score}`;
  $("fill").style.width=(i/deck.length*100)+"%";
  $("qText").textContent=cur.q;
  $("fb").textContent="";$("fb").className="feedback";
  $("next").hidden=true;
  const box=$("answers");box.innerHTML="";
  cur.opts.forEach((o,k)=>{
    const b=document.createElement("button");
    b.className="ans";b.dataset.val=o;
    b.innerHTML=`<span class="letter">${L[k]}</span><span></span>`;
    b.lastChild.textContent=o;
    b.addEventListener("click",()=>pick(b));
    box.appendChild(b);
  });
  box.firstChild.focus({preventScroll:true});
}
function pick(b){
  const cur=deck[i];
  const btns=[...$("answers").children];
  if(btns[0].disabled)return;
  btns.forEach(x=>{x.disabled=true;if(x.dataset.val===cur.good)x.classList.add("right");});
  if(b.dataset.val===cur.good){
    score++;$("fb").textContent="Dobrze!";$("fb").classList.add("ok");
  }else{
    b.classList.add("wrong");
    $("fb").textContent="Niestety nie. Poprawna odpowiedź jest zaznaczona na zielono.";
    $("fb").classList.add("bad");
    misses.push({q:cur.q,yours:b.dataset.val,good:cur.good});
  }
  $("pts").textContent=`Punkty: ${score}`;
  $("next").textContent=i===deck.length-1?"Zobacz wynik":"Następne pytanie";
  $("next").hidden=false;$("next").focus({preventScroll:true});
}
function next(){i++; if(i>=deck.length)finish(); else render();}
function finish(answered){
  const total=answered??deck.length;
  $("resNum").textContent=score;
  $("resOf").textContent=`/ ${total}`;
  const p=total?score/total:0;
  $("resMsg").textContent=
    p===1?"Bezbłędnie! Znasz tę książkę jak Ania swoje marzenia."
    :p>=0.8?"Świetny wynik! Prawie wszystko pamiętasz."
    :p>=0.6?"Dobrze! Kilka rzeczy warto jeszcze powtórzyć."
    :p>=0.4?"Nieźle, ale lektura czeka na powtórkę."
    :"Warto jeszcze raz zajrzeć do książki i spróbować ponownie.";
  const ul=$("review");ul.innerHTML="";
  $("reviewWrap").hidden=!misses.length;
  misses.forEach(m=>{
    const li=document.createElement("li");
    li.innerHTML=`<div class="q"></div><div class="yours"></div><div class="good"></div>`;
    li.children[0].textContent=m.q;
    li.children[1].textContent="Twoja odpowiedź: "+m.yours;
    li.children[2].textContent="Poprawna: "+m.good;
    ul.appendChild(li);
  });
  show("end");
}
$("go").addEventListener("click",start);
$("next").addEventListener("click",next);
$("quit").addEventListener("click",()=>{
  const btns=[...$("answers").children];
  const answered=i+(btns[0]&&btns[0].disabled?1:0);
  finish(answered);
});
$("again").addEventListener("click",start);
$("home").addEventListener("click",()=>show("start"));
document.addEventListener("keydown",e=>{
  if($("quiz").hidden)return;
  const k=e.key.toUpperCase(), idx="ABCD".indexOf(k)>-1?"ABCD".indexOf(k):"1234".indexOf(k);
  const btns=[...$("answers").children];
  if(idx>-1&&btns[idx]&&!btns[idx].disabled)pick(btns[idx]);
  else if(e.key==="Enter"&&!$("next").hidden&&document.activeElement!==$("next")){e.preventDefault();next();}
});
</script>
</body>
</html>
